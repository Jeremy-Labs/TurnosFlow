name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnosflow
          POSTGRES_PASSWORD: turnosflow
          POSTGRES_DB: turnosflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnosflow -d turnosflow_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://turnosflow:turnosflow@localhost:5432/turnosflow_ci?schema=public
      AUTH_SECRET: ci-only-test-secret-not-for-production
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
